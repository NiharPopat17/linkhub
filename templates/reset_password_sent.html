{% extends 'main.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'styles/auth.css' %}" />

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <h2 class="auth-card__title">Check Your Email</h2>
      <p class="auth-card__subtitle">We've sent password reset instructions to your email. Check your inbox and spam folder.</p>
    </div>

    <div class="auth-card__footer" style="border-top:none; margin-top:0; padding-top:0;">
      <p>Back to <a href="{% url 'login' %}">Log In</a></p>
    </div>
  </div>
</div>

{% endblock content %}
