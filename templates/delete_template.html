{% extends 'main.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'styles/form-page.css' %}" />

<main class="fp">
  <div class="fp-card" style="max-width: 46rem;">
    <a class="fp-back" href="{{ request.GET.next }}">
      <i class="fas fa-arrow-left"></i> Go Back
    </a>

    <h2 class="fp-heading">Confirm Deletion</h2>
    <p class="fp-subtext">Are you sure you want to delete "{{ object }}"? This action cannot be undone.</p>

    <hr class="fp-divider" />

    <form method="POST" action="">
      {% csrf_token %}
      <div class="fp-actions">
        <input class="fp-submit" type="submit" value="Delete" style="background: var(--color-error);" />
        <a class="fp-cancel" href="{{ request.GET.next }}">Cancel</a>
      </div>
    </form>
  </div>
</main>

{% endblock %}
