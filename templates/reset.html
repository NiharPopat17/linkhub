{% extends 'main.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'styles/auth.css' %}" />

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <h2 class="auth-card__title">Set New Password</h2>
      <p class="auth-card__subtitle">Enter your new password twice to confirm.</p>
    </div>

    <form method="POST" class="auth-form">
      {% csrf_token %}

      {% for field in form %}
      <div class="auth-form__field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}
        <p class="auth-form__error">{{ error }}</p>
        {% endfor %}
      </div>
      {% endfor %}

      <button type="submit" class="auth-form__btn">Reset Password</button>
    </form>
  </div>
</div>

{% endblock content %}
