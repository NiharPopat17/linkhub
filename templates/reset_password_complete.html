{% extends 'main.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'styles/auth.css' %}" />

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <h2 class="auth-card__title">Password Reset Complete</h2>
      <p class="auth-card__subtitle">Your password has been updated. You can now log in with your new password.</p>
    </div>

    <a href="{% url 'login' %}" class="auth-form__btn" style="text-align:center; text-decoration:none; display:block;">Log In</a>
  </div>
</div>

{% endblock content %}
