{% extends 'main.html' %}

{% block content %}
<main class="formPage my-xl">
    <div class="content-box">
        <div class="formWrapper">

            <!-- Back button -->
            <a href="{% url 'user-profile' recipient.id %}" style="
              display:inline-flex;align-items:center;justify-content:center;
              width:3.6rem;height:3.6rem;border-radius:50%;
              background:#f0f2f1;color:#2d2d39;
              font-size:2.2rem;font-weight:bold;text-decoration:none;
              margin-bottom:1.5rem;transition:background 0.15s;
            " onmouseover="this.style.background='#e0e3e1'" onmouseout="this.style.background='#f0f2f1'">&lsaquo;</a>

            <form class="form" method="POST">
                {% csrf_token %}

                {% if request.user.is_authenticated == False %}
                <div class="form__field">
                    <label for="formInput#text">{{form.name.label}}</label>
                    {{form.name}}
                </div>
                <div class="form__field">
                    <label for="formInput#text">{{form.email.label}}</label>
                    {{form.email}}
                </div>
                {% endif %}

                <div class="form__field">
                    <label for="formInput#text">{{form.subject.label}}</label>
                    {{form.subject}}
                    <p id="subject-hint" style="display:none;font-size:1.2rem;color:#888;margin-top:0.3rem;">
                        <kbd style="background:#eee;border:1px solid #ccc;border-radius:3px;padding:1px 5px;font-size:1.1rem;">Tab</kbd>
                        to accept: <span id="subject-suggestion" style="color:#333;font-style:italic;"></span>
                    </p>
                </div>

                <div class="form__field">
                    <label for="formInput#text">{{form.body.label}}</label>
                    {{form.body}}
                    <p id="body-hint" style="display:none;font-size:1.2rem;color:#888;margin-top:0.3rem;">
                        <kbd style="background:#eee;border:1px solid #ccc;border-radius:3px;padding:1px 5px;font-size:1.1rem;">Tab</kbd>
                        to accept: <span id="body-suggestion" style="color:#333;font-style:italic;"></span>
                    </p>
                </div>

                <input class="btn btn--sub btn--lg my-md" type="submit" value="Submit" />
            </form>
        </div>
    </div>
</main>

<script>
    function getCookie(name) {
        let val = null;
        if (document.cookie) {
            for (const c of document.cookie.split(';')) {
                const [k, v] = c.trim().split('=');
                if (k === name) { val = decodeURIComponent(v); break; }
            }
        }
        return val;
    }

    function makePredictor(inputEl, hintEl, hintSpanEl) {
        if (!inputEl) return;
        let currentSuggestion = '';
        let baseText = '';
        let debounceTimer;

        function showSuggestion(text, sugg) {
            baseText = text;
            currentSuggestion = sugg;
            inputEl.value = text + sugg;
            inputEl.setSelectionRange(text.length, inputEl.value.length);
            hintSpanEl.textContent = sugg;
            hintEl.style.display = 'block';
        }

        function clearSuggestion(restoreBase) {
            if (restoreBase && currentSuggestion) {
                inputEl.value = baseText;
                inputEl.setSelectionRange(baseText.length, baseText.length);
            }
            currentSuggestion = '';
            baseText = '';
            hintEl.style.display = 'none';
            hintSpanEl.textContent = '';
        }

        inputEl.addEventListener('keydown', (e) => {
            if ((e.key === 'Tab' || e.key === 'ArrowRight') && currentSuggestion) {
                e.preventDefault();
                const accepted = baseText + currentSuggestion;
                inputEl.value = accepted;
                inputEl.setSelectionRange(accepted.length, accepted.length);
                currentSuggestion = '';
                baseText = '';
                hintEl.style.display = 'none';
                return;
            }
            if (currentSuggestion) {
                inputEl.value = baseText;
                inputEl.setSelectionRange(baseText.length, baseText.length);
                currentSuggestion = '';
                baseText = '';
                hintEl.style.display = 'none';
            }
        });

        inputEl.addEventListener('keyup', (e) => {
            if (e.key === 'Tab' || e.key === 'ArrowRight' || currentSuggestion) return;
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const text = inputEl.value;
                if (!text.trim()) return;
                fetch('/api/predict-next-word/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ text })
                })
                .then(r => r.json())
                .then(data => {
                    const sugg = data.suggestion || '';
                    if (sugg && !currentSuggestion) showSuggestion(inputEl.value, sugg);
                })
                .catch(() => {});
            }, 300);
        });

        inputEl.addEventListener('blur', () => clearSuggestion(true));
        inputEl.addEventListener('mousedown', () => { if (currentSuggestion) clearSuggestion(true); });
    }

    // Wire up both fields
    makePredictor(
        document.getElementById('id_subject'),
        document.getElementById('subject-hint'),
        document.getElementById('subject-suggestion')
    );
    makePredictor(
        document.getElementById('id_body'),
        document.getElementById('body-hint'),
        document.getElementById('body-suggestion')
    );
</script>

{% endblock content %}
