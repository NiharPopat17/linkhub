{% extends 'main.html' %}

{% block content %}


<div class="auth" style="height:auto; min-height:100vh;">
    <!-- Main Section -->
    <main class="formPage my-xl">
        <div class="content-box">
            <div class="formWrapper">
                <a href="{% url 'account' %}"
                    style="display:inline-flex;align-items:center;justify-content:center;width:4rem;height:4rem;border-radius:50%;background:#94a69e;color:#fff;font-size:2rem;font-weight:bold;text-decoration:none;margin-bottom:1rem;">&lsaquo;</a>
                <br>
                <form class="form" method="POST" action="{% url 'edit-account' %}" enctype="multipart/form-data">
                    {% csrf_token %}

                    {% for field in form %}
                    <div class="form__field">
                        <label for="formInput#text">{{field.label}}</label>
                        {% if field.html_name == 'profile_image' %}
                            {% if form.instance.profile_image %}
                            <div style="margin-bottom: 10px;">
                                <img
                                    src="{{ form.instance.imageURL }}"
                                    alt="Current profile picture"
                                    style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #94a69e;"
                                />
                                <p style="font-size: 0.8rem; color: #888; margin: 6px 0 0;">Choose a new image to replace this one.</p>
                            </div>
                            {% endif %}
                        {% endif %}
                        {{field}}
                    </div>
                    {% endfor %}

                    <input class="btn btn--sub btn--lg  my-md" type="submit" value="Submit" />
                </form>
            </div>
        </div>
    </main>
</div>

{% endblock content %}
